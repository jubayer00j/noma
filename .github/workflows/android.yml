name: Build Android App

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Setup Stable Debug Keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Stable debug keystore successfully configured."
          else
            echo "ERROR: ANDROID_DEBUG_KEYSTORE_BASE64 secret is not set. A stable keystore is required for Google Sign-In to function."
            exit 1
          fi

      - name: Build Android debug APK
        working-directory: ./android
        env:
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_PASSWORD" ] || [ -z "$DEBUG_KEY_ALIAS" ]; then
            echo "ERROR: ANDROID_DEBUG_KEYSTORE_PASSWORD or ANDROID_DEBUG_KEY_ALIAS secrets are missing. A stable keystore configuration is required."
            exit 1
          fi

          ./gradlew assembleDebug \
            -Pandroid.injected.signing.store.file=$HOME/.android/debug.keystore \
            -Pandroid.injected.signing.store.password=$DEBUG_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$DEBUG_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$DEBUG_KEYSTORE_PASSWORD

      - name: Print APK Signing Certificate Fingerprint
        working-directory: ./android
        run: |
          build_tools_dir=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          $build_tools_dir/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Setup Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > ~/.android/release.keystore
            echo "Release keystore successfully configured."
          else
            echo "ERROR: ANDROID_RELEASE_KEYSTORE_BASE64 secret is not set. A release keystore is required for signed release builds."
            exit 1
          fi

      - name: Build Android release APK and bundle
        working-directory: ./android
        env:
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_RELEASE_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_RELEASE_KEY_ALIAS" ] || [ -z "$ANDROID_RELEASE_KEY_PASSWORD" ]; then
            echo "ERROR: Release signing secrets are missing. A release keystore configuration is required."
            exit 1
          fi
          export ANDROID_RELEASE_STORE_FILE="$HOME/.android/release.keystore"
          ./gradlew assembleRelease bundleRelease

      - name: Print Release APK Signing Certificate Fingerprint
        working-directory: ./android
        run: |
          build_tools_dir=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          $build_tools_dir/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Release Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
